DEF ActionKey
DEF BackKey

DEF ClearKey
DEF InvKey

DEF UpKey
DEF DownKey
DEF LeftKey
DEF RightKey

CALCULATOR {
    ActionKey = Key_2nd
        .name = "2nd"
    BackKey = Key_Alpha
        .name = "Alpha"

    ClearKey = Key_Clear
        .name = "Clear"
    InvKey = Key_Del
        .name = "Del"
    
    UpKey = Key_Up
        .name = "Up"
    DownKey = Key_Down
        .name = "Down"
    LeftKey = Key_Left
        .name = "Left"
    RightKey = Key_Right
        .name = "Right"
}

KEYBOARD {
    ActionKey = Key_Space, Key_Z      # several keys, one action
        .name = "Space"               # optional; defaults to the first key
    BackKey = Key_Tab, Key_X
        .name = "Tab"

    ClearKey = Key_C, Key_Esc
        .name = "Esc"
    InvKey = Key_Del, Key_Backspace, Key_I
        .name = "I"
    
    UpKey = Key_Arrow_Up, Key_W
        .name = "Up"
    DownKey = Key_Arrow_Down, Key_S
        .name = "Down"
    LeftKey = Key_Arrow_Left, Key_A
        .name = "Left"
    RightKey = Key_Arrow_Right, Key_D
        .name = "Right"
}

GAMEPAD {
    ActionKey = Pad_A
    BackKey   = Pad_B

    ClearKey = Pad_Plus
        .name.gc = "Start"
        .name = "+"
    InvKey = Pad_Minus
        .name = "-"
        .gc = Pad_X
        .name.gc = "X"
    
    UpKey = Pad_Up, Pad_Left_Pos_Y
        .name = "Up"
    DownKey = Pad_Down, Pad_Left_Neg_Y
        .name = "Down"
    LeftKey = Pad_Left, Pad_Left_Neg_X
        .name = "Left"
    RightKey = Pad_Right, Pad_Left_Pos_X
        .name = "Right"
}

MOBILE {
    ActionKey = Touch_Button          # on-screen button
        .name = "A"
    BackKey   = Touch_Button
        .name = "B"

    ClearKey = Touch_Button
        .name = "Clr"
    InvKey = Touch_Button
        .name = "Inv"
    
    UpKey = Touch_Up
        .name = "Up"
    DownKey = Touch_Down
        .name = "Down"
    LeftKey = Touch_Left
        .name = "Left"
    RightKey = Touch_Right
        .name = "Right"
}